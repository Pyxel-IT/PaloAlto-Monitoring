services:
  influxdb:
    image: influxdb:1.8
    restart: unless-stopped
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb
    environment:
      - INFLUXDB_DB=${INFLUXDB_DB:-paloalto_monitoring}
      - INFLUXDB_ADMIN_USER=${INFLUXDB_ADMIN_USER:-admin}
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:-yqdfnkLLSbtQFt6j}
      - INFLUXDB_USER=${INFLUXDB_USER:-collector}
      - INFLUXDB_USER_PASSWORD=${INFLUXDB_USER_PASSWORD:-eSJmY4mNBhtQb8hA}
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ${DASHBOARDS_PATH:-../dashboards}:/etc/grafana/provisioning/dashboards
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/influxdb.yaml:ro
      - ./grafana-dashboard-config.yaml:/etc/grafana/provisioning/dashboards/config.yaml:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-G3TQYaRgPsdTRQx6}
      - GF_INSTALL_PLUGINS=
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - monitoring

  collector:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    volumes:
      - ${CONFIG_PATH:-../config}:/app/config:ro
      - ${LOGS_PATH:-../logs}:/app/logs
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - monitoring
    environment:
      - PYTHONUNBUFFERED=1
    command: sh -c "sleep 10 && python src/collector.py"

  grafana-init:
    image: curlimages/curl:latest
    volumes:
      - ./grafana-init.sh:/grafana-init.sh:ro
    depends_on:
      - grafana
    networks:
      - monitoring
    command: sh /grafana-init.sh
    restart: "no"

networks:
  monitoring:
    driver: bridge

volumes:
  influxdb-data:
  grafana-data:
